<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evalneth Revolution — Stubborn Pimples, Black Spots & Rough Skin Solution</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  :root{
    --green-deep:#123626;
    --green-mid:#1c4a35;
    --gold:#c99a3e;
    --gold-light:#e0b563;
    --cream:#f6f1e7;
    --cream-2:#efe8d8;
    --text-dark:#1d2b23;
    --text-muted:#4c5a52;
    --pink:#f3d9e2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Georgia','Times New Roman',serif;
    background:var(--cream);
    color:var(--text-dark);
    line-height:1.5;
  }
  img{max-width:100%;display:block;}
  .sans{font-family:Arial,Helvetica,sans-serif;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px;}

  /* ---------- HEADER ---------- */
  header{
    background:var(--green-deep);
    color:#fff;
    padding:14px 0;
    position:sticky;top:0;z-index:100;
    border-bottom:3px solid var(--gold);
  }
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:bold;letter-spacing:.5px;}
  .logo .leaf{font-size:1.7rem;color:var(--gold-light);}
  .logo .sub{display:block;font-size:.65rem;letter-spacing:2px;color:var(--gold-light);font-weight:normal;text-transform:uppercase;}
  .nav-perks{display:flex;gap:26px;flex-wrap:wrap;font-family:Arial,sans-serif;font-size:.78rem;font-weight:600;}
  .nav-perks .perk{display:flex;align-items:center;gap:8px;}
  .nav-perks .perk .ic{font-size:1.2rem;color:var(--gold-light);}
  .nav-perks .perk span{line-height:1.15;}
  
  .header-actions {display: flex; align-items: center; gap: 12px;}
  
  .btn-order{
    background:var(--gold);
    color:var(--green-deep);
    font-family:Arial,sans-serif;
    font-weight:800;
    padding:12px 22px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    font-size:.95rem;
    white-space:nowrap;
    display:inline-block;
    text-align:center;
    transition:transform .15s ease, background .15s ease;
  }
  .btn-order:hover{background:var(--gold-light);transform:translateY(-1px);}
  
  .cart-btn-trigger {
    background: var(--green-mid);
    border: 2px solid var(--gold);
    color: #fff;
    font-family: Arial, sans-serif;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: .9rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    position: relative;
    transition: background .15s ease;
  }
  .cart-btn-trigger:hover { background: var(--gold); color: var(--green-deep); }
  .cart-badge {
    background: var(--gold);
    color: var(--green-deep);
    font-size: 0.75rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .cart-btn-trigger:hover .cart-badge { background: var(--green-deep); color: #fff; }

  .btn-whatsapp{
    background:transparent;
    border:2px solid var(--green-deep);
    color:var(--green-deep);
    font-family:Arial,sans-serif;
    font-weight:700;
    padding:12px 22px;
    border-radius:6px;
    cursor:pointer;
    font-size:.9rem;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .15s ease,color .15s ease;
  }
  .btn-whatsapp:hover{background:var(--green-deep);color:#fff;}

  /* ---------- HERO ---------- */
  .hero{padding:60px 0 40px;background:var(--cream);}
  .hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:50px;align-items:center;}
  .badge-struggle{
    display:inline-block;background:var(--gold);color:var(--green-deep);
    font-family:Arial,sans-serif;font-weight:800;font-size:1.44rem;letter-spacing:1.5px;
    padding:6px 14px;border-radius:3px;margin-bottom:16px;text-transform:uppercase;
  }
  .hero h1{
    font-size:2.5rem;line-height:1.15;color:var(--green-deep);font-weight:800;
    margin-bottom:10px;
  }
  .hero .tagline{
    font-style:italic;color:var(--gold);font-size:1.35rem;margin-bottom:18px;font-weight:700;
  }
  .hero p{font-family:Arial,sans-serif;color:var(--text-muted);font-size:.95rem;margin-bottom:14px;max-width:52ch;}
  .hero .cta-row{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;}

  .hero-visual{position:relative;}
  .hero-visual .frame{
    background:#fff;border-radius:14px;padding:14px;box-shadow:0 20px 50px rgba(18,54,38,.15);
  }
  .hero-visual img{border-radius:8px;}
  .price-badge{
    position:absolute;bottom:-18px;right:-10px;
    width:150px;height:150px;border-radius:50%;
    background:var(--green-deep);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.25);
    border:3px solid var(--gold-light);
    font-family:Arial,sans-serif;
  }
  .price-badge .only{font-size:.65rem;letter-spacing:1px;opacity:.85;}
  .price-badge .amt{font-size:1.35rem;font-weight:800;color:var(--gold-light);line-height:1.1;}
  .price-badge .free{font-size:.6rem;font-weight:700;margin-top:4px;letter-spacing:.5px;}
  .price-badge .sub{font-size:.5rem;opacity:.75;margin-top:1px;}

  /* trust icons */
  .trust-row{
    padding:26px 0;border-top:1px solid #e3dbc7;border-bottom:1px solid #e3dbc7;
    font-family:Arial,sans-serif;
  }
  .trust-row .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .trust-item{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:700;color:var(--green-deep);}
  .trust-item .ic{font-size:1.3rem;}

  /* ---------- BEFORE/AFTER STRIP ---------- */
  .transform{padding:50px 0 0;}
  .transform .grid3{
    display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;
  }
  .transform .arrow{font-size:1.8rem;color:var(--gold);font-weight:900;}
  .photo-card{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.12);}
  .photo-card img{width:100%;height:340px;object-fit:cover;}
  .photo-tag{
    position:absolute;bottom:14px;left:14px;background:var(--green-deep);color:#fff;
    font-family:Arial,sans-serif;font-weight:800;font-size:.75rem;letter-spacing:1px;
    padding:6px 14px;border-radius:4px;text-transform:uppercase;
  }
  .feature-strip{
    margin-top:40px;background:var(--green-deep);color:#fff;
    font-family:Arial,sans-serif;font-weight:700;font-size:.82rem;
    padding:16px 0;
  }
  .feature-strip .wrap{display:flex;justify-content:space-around;flex-wrap:wrap;gap:14px;text-align:center;}
  .feature-strip .item{display:flex;align-items:center;gap:8px;}
  .feature-strip .ic{color:var(--gold-light);}

  /* ---------- THREE ESSENTIALS ---------- */
  .essentials{padding:64px 0;text-align:center;}
  .essentials h2{color:var(--green-deep);font-size:2rem;font-weight:800;letter-spacing:.5px;}
  .essentials .sub{color:var(--gold);font-family:Arial,sans-serif;font-weight:800;font-size:.9rem;letter-spacing:1px;margin-top:6px;margin-bottom:44px;}
  .prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:36px;}
  .prod-card{padding:0 10px;}
  .prod-card .imgwrap{
    height:210px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  }
  .prod-card .imgwrap img{max-height:210px;width:auto;margin:0 auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.15));}
  .prod-card h3{font-family:Arial,sans-serif;color:var(--green-deep);font-weight:800;font-size:1.05rem;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;}
  .prod-card p{font-family:Arial,sans-serif;color:var(--text-muted);font-size:.85rem;max-width:30ch;margin:0 auto;}

  /* ---------- 3 STEPS ---------- */
  .steps{padding:20px 0 60px;}
  .steps h2{text-align:center;color:var(--green-deep);font-size:1.4rem;font-weight:800;margin-bottom:40px;letter-spacing:.5px;}
  .steps-row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px;}
  .step{display:flex;align-items:center;gap:16px;}
  .step .circ{
    width:74px;height:74px;border-radius:50%;overflow:hidden;flex-shrink:0;
    border:3px solid var(--gold-light);
  }
  .step .circ img{width:100%;height:100%;object-fit:cover;}
  .step .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:var(--green-deep);color:#fff;
    font-family:Arial,sans-serif;font-size:.7rem;font-weight:800;margin-bottom:4px;
  }
  .step h4{font-family:Arial,sans-serif;color:var(--green-deep);font-weight:800;font-size:.85rem;letter-spacing:1px;margin-bottom:3px;}
  .step p{font-family:Arial,sans-serif;color:var(--text-muted);font-size:.78rem;max-width:20ch;}
  .steps-row .arrow{font-size:1.5rem;color:var(--gold);font-weight:900;}

  /* ---------- TESTIMONIALS ---------- */
  .testimonials{padding:50px 0 70px;background:var(--cream-2);}
  .testimonials h2{text-align:center;color:var(--green-deep);font-size:1.5rem;font-weight:800;margin-bottom:36px;letter-spacing:.5px;}
  .testi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;align-items:start;}
  .testi-card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.08);}
  .testi-card img{width:100%;display:block;}

  /* ---------- FINAL CTA / FOOTER ---------- */
  .final-cta{background:var(--green-deep);color:#fff;padding:36px 0;}
  .final-cta .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:30px;align-items:center;}
  .final-cta .prodshot{width:170px;border-radius:8px;}
  .final-cta h3{font-family:Arial,sans-serif;font-size:1.15rem;font-weight:800;letter-spacing:.5px;}
  .final-cta .setline{font-family:Arial,sans-serif;color:var(--gold-light);font-size:.85rem;margin:6px 0 10px;}
  .final-cta .price{font-size:1.7rem;color:var(--gold-light);font-weight:800;margin-bottom:10px;font-family:Arial,sans-serif;}
  .final-cta ul{font-family:Arial,sans-serif;font-size:.78rem;color:#dfe8e1;list-style:none;}
  .final-cta ul li{margin-bottom:4px;padding-left:16px;position:relative;}
  .final-cta ul li::before{content:"✓";position:absolute;left:0;color:var(--gold-light);}
  .final-cta .cta-block{text-align:center;}
  .final-cta .btn-order{width:100%;font-size:1.05rem;padding:16px 20px;margin-bottom:10px;}
  .final-cta .secure{font-family:Arial,sans-serif;font-size:.7rem;color:#b9c7bd;margin-bottom:8px;}
  .paymethods{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .paymethods span{
    background:#fff;color:var(--green-deep);
